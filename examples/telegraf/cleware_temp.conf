# Telegraf input for the Cleware USB-Temp (firmware v5) sensor.
#
# Drop this into /etc/telegraf/telegraf.d/ (or paste the block into your main
# telegraf.conf). It runs the cleware_temp binary every collection interval and
# parses its InfluxDB line protocol output into the `cleware_temp` measurement.
#
# Telegraf runs as the unprivileged `telegraf` user, so it needs access to the
# USB device. Pick ONE of:
#   a) sudo   — see examples/sudoers.d/telegraf-cleware  (then use the command
#               line with sudo below), or
#   b) udev   — see examples/udev/99-cleware-usbtemp.rules (then drop the sudo).

[[inputs.exec]]
  ## (a) with sudo (default in this example):
  commands = ["sudo /usr/local/bin/cleware_temp"]
  ## (b) with a udev rule granting group access, no sudo:
  # commands = ["/usr/local/bin/cleware_temp"]

  timeout = "5s"
  data_format = "influx"

# The measurement is named `cleware_temp`. If your influxdb_v2 output uses a
# `namepass` allow-list, remember to add it there, e.g.:
#
# [[outputs.influxdb_v2]]
#   urls = ["http://influxdb.example:8086"]
#   token = "..."
#   organization = "your-org"
#   bucket = "sensors"
#   namepass = ["cleware_temp"]   # plus whatever else you already pass
